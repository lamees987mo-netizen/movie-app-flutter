name: movie_app
description: "A TMDB movie browser built with Clean Architecture, Bloc/Cubit, Dio, Hive and go_router."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  bloc_concurrency: ^0.3.0
  cached_network_image: ^4.0.3
  cloud_firestore: ^7.2.0
  connectivity_plus: ^7.3.2
  dio: ^5.11.1
  equatable: ^3.0.0
  firebase_analytics: ^13.0.1
  firebase_auth: ^7.1.0
  firebase_core: ^5.1.0
  firebase_crashlytics: ^6.0.1
  flutter:
    sdk: flutter
  flutter_bloc: ^9.1.1
  flutter_localizations:
    sdk: flutter
  get_it: ^9.3.0
  go_router: ^18.1.4
  google_sign_in: ^7.2.0
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  intl: ^0.20.2
  json_annotation: ^4.12.0
  skeletonizer: ^3.0.0
  url_launcher: ^6.3.3
  youtube_player_iframe: ^6.0.2

dev_dependencies:
  bloc_test: ^10.0.0
  build_runner: ^2.15.1
  firebase_auth_mocks: ^0.16.0
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  json_serializable: ^6.15.2
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
