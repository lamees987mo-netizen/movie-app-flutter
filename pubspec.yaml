name: movie_app
description: "A TMDB movie browser built with Clean Architecture, Bloc/Cubit, Dio, Hive and go_router."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: ^0.20.2
  flutter_bloc: ^9.1.1
  bloc_concurrency: ^0.3.0
  equatable: ^3.0.0
  dio: ^5.11.1
  get_it: ^9.3.0
  go_router: ^18.1.4
  hive_ce: ^2.23.3
  hive_ce_flutter: ^2.5.0
  cached_network_image: ^4.0.3
  url_launcher: ^6.3.3
  skeletonizer: ^3.0.0
  connectivity_plus: ^7.3.2
  json_annotation: ^4.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter
  build_runner: ^2.15.1
  json_serializable: ^6.15.2
  bloc_test: ^10.0.0
  mocktail: ^1.0.5
  very_good_analysis: ^10.3.0

flutter:
  uses-material-design: true
  generate: true
