name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.5
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # Generated code (json_serializable, gen-l10n) is committed, so a fresh
      # clone builds without running generators. Fail if it is out of date.
      - name: Check generated code is up to date
        run: |
          dart run build_runner build -d
          flutter gen-l10n
          git diff --exit-code -- lib

      - name: Check formatting
        run: dart format --set-exit-if-changed lib test integration_test

      - name: Analyze
        run: flutter analyze

      # No TMDB token needed: every test uses mocks or fakes.
      - name: Test with coverage
        run: flutter test --coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
